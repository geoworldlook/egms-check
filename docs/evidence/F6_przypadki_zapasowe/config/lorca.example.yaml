# Przypadek C - Lorca (opcjonalny). Uruchamiać dopiero po A i po znalezieniu otwartych szeregów GNSS 3D.
case_id: case_c_lorca
reference_publication: "Koudogbo et al. 2025 (EGMS Validation Report, 2019-2023), sec. 3.1.3"

egms:
  products: [L2a, L2b]
  release: TODO                # raport dotyczy wydania 2019_2023
  tracks:
    - {track: 103, pass: ascending}
    - {track: 1,   pass: ascending}
    - {track: 8,   pass: descending}   # w jednym podpisie ryciny raportu: 088 (Plan_v1_otwarte_pytania, D3)
  remove_burst_overlap_duplicates: true

stations:
  reference: CARG              # stacja odniesienia dla podwójnych różnic L2a (raport)
  in_bowl: [LORC, LRCA, ORCA]  # ORCA: dane tylko do 2020, operator IGME
  outside_bowl: [CARG, HUOV, MAZA, ACAL, CRTG]
  coordinates: TODO

gnss:
  source: TODO                 # otwarte szeregi dobowe E, N, U (Plan_v1_otwarte_pytania, D1)
  components: [east, north, up]
  frame: TODO

los_projection:
  method: full_3d              # ruch poziomy do 2,5 cm/rok (Fernandez et al. 2018) - rzut samego pionu niedopuszczalny

spatial:
  crs_epsg: 3035
  buffer_radii_m: [100]        # metodyka EEA
  min_points: 3

acceptance:
  outside_bowl_velocity_difference_mm_yr: 0.6
  in_bowl: report_only

outputs:
  dir: results/case_c_lorca
